/* Semantic tokens, filled in per mode. The two retro modes map them onto exactly four
   tones; MODERN spends a full palette. Nothing below hard-codes a colour. */
:root{
  --bg:#0d0d0d; --shell:#4f4f4f; --panel:#e8e8e8; --surface:#e8e8e8; --surface2:#a1a1a1;
  --ink:#0d0d0d; --ink2:#4f4f4f; --line:#0d0d0d; --accent:#0d0d0d; --accentInk:#e8e8e8;
  --px:3px;                       /* the base pixel unit; every metric is a multiple */
  /* Silkscreen carries no CJK, so Chinese falls straight through to the system face.
     Latin therefore stays on the pixel grid while 中文 stays legible. */
  --font:Silk,"PingFang TC","PingFang SC","Heiti TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  /* The type ramp splits by KIND, not by size: names, labels and numbers stay on the
     pixel face; anything that is a sentence moves to the serif. Reading two lines of
     prose in a bitmap font is the thing this fixes. */
  --prose:Lit,"PingFang TC","PingFang SC","Songti TC","Noto Serif TC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);
     padding:calc(var(--px)*4);line-height:1.45;position:relative}

/* ---------- atmosphere ----------
   Ordered dithering, which is how this hardware faked gradients and shading in the first
   place — so depth arrives in the era's own vocabulary rather than as a modern gradient.
   Both layers live OUTSIDE the device shell and never composite over artwork or text;
   that was the flaw in the earlier LCD-grid overlay, which dirtied every sprite.
   Tiles are canvas-generated per mode (see ditherTile) so the dots land on exact pixels
   and only ever use colours already in the mode's palette. */
body{background-image:var(--dither-a);background-repeat:repeat}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:var(--dither-b);background-repeat:repeat;
  /* density rises toward the margins, so the centre — where the shell sits — stays clean */
  -webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 42%,transparent 45%,#000 100%);
          mask-image:radial-gradient(ellipse 62% 58% at 50% 42%,transparent 45%,#000 100%)}
.dmg{position:relative;z-index:1}
/* Crispness is only wanted where the pixel face actually renders. Forcing it on CJK
   turns 11px Chinese into mush. These slots are always Latin: */
h1,.sub,.no,.mg,.ty,.tally b,footer b{-webkit-font-smoothing:none;font-smooth:never}
/* …while the name slots swap language with the toggle, so the rule has to follow it.
   .nm/.fm/.palt hold the leading language; .na/.phead h2's sibling holds the other. */
body.lang-en .nm,body.lang-en .fm,body.lang-en .phead h2,
body:not(.lang-en) .na{-webkit-font-smoothing:none;font-smooth:never}
img{display:block}
button,input{font:inherit;color:inherit}

/* ---------- shell ---------- */
.dmg{max-width:1180px;margin:0 auto;background:var(--shell);padding:calc(var(--px)*3);
     box-shadow:0 0 0 var(--px) var(--line), 0 0 0 calc(var(--px)*4) var(--shell),
                0 0 0 calc(var(--px)*5) var(--line)}
.screen{background:var(--panel);padding:calc(var(--px)*4);position:relative;
        box-shadow:inset 0 0 0 var(--px) var(--line)}

/* ---------- masthead ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:calc(var(--px)*4);
     border-bottom:var(--px) solid var(--line);padding-bottom:calc(var(--px)*3);margin-bottom:calc(var(--px)*3)}
h1{font-size:26px;font-weight:700;letter-spacing:.06em;line-height:1}
.sub{font-size:11px;color:var(--ink2);letter-spacing:.08em;margin-top:calc(var(--px)*2)}
.tally{margin-left:auto;display:flex;gap:calc(var(--px)*3);flex-wrap:wrap}
.tally div{background:var(--accent);color:var(--accentInk);padding:calc(var(--px)*1) calc(var(--px)*2);
           font-size:12px;letter-spacing:.04em}
.tally b{font-size:18px;display:block;letter-spacing:0;line-height:1.1}

/* ---------- controls ---------- */
.ctl{display:flex;flex-direction:column;gap:calc(var(--px)*3);margin-bottom:calc(var(--px)*4)}
.row{display:flex;flex-wrap:wrap;gap:calc(var(--px)*2);align-items:center}
.lbl{font-size:13px;color:var(--ink2);letter-spacing:.06em;min-width:44px}
.tick{font-size:13px;color:var(--ink2);letter-spacing:.02em}
.srch{flex:1;min-width:150px;background:var(--surface);border:var(--px) solid var(--line);
      padding:calc(var(--px)*2);font-size:14px;outline:none}
.srch:focus{background:var(--surface2)}
.srch::placeholder{color:var(--ink2);opacity:.8}

.chip{background:var(--surface);border:var(--px) solid var(--line);color:var(--ink);
      padding:calc(var(--px)*1) calc(var(--px)*2);font-size:13px;cursor:pointer;letter-spacing:.03em;
      display:flex;align-items:center;gap:calc(var(--px)*1);line-height:1.2;min-height:30px}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accentInk)}
.chip img{width:16px;height:16px;image-rendering:pixelated}
.chip.wide{padding:calc(var(--px)*1) calc(var(--px)*3)}
/* In MODERN a type chip carries its own colour. The retro modes must NOT pick up --tc
   anywhere — a single type-coloured border would break the four-tone contract. */
body.modern .chip.tc{background:var(--tc);color:var(--tcInk);border-color:var(--tc)}
body.modern .chip.tc[aria-pressed=true]{box-shadow:inset 0 0 0 var(--px) var(--accent);
                                        border-color:var(--accent)}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:calc(var(--px)*3)}
.card{background:var(--surface);border:var(--px) solid var(--line);padding:calc(var(--px)*2);
      cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:calc(var(--px)*1);
      /* 1px bevel — light along the top-left, shadow along the bottom-right. Reads as a
         moulded key without spending a colour: both edges come from the existing tones. */
      box-shadow:inset 1px 1px 0 var(--panel), inset -1px -1px 0 var(--surface2)}
.card:hover{background:var(--surface2)}
.card:focus-visible{outline:none;background:var(--surface2);
                    box-shadow:0 0 0 var(--px) var(--line),inset 0 0 0 var(--px) var(--ink2)}
.card[aria-current=true]{background:var(--accent)}
.card[aria-current=true] .nm,.card[aria-current=true] .no,
.card[aria-current=true] .fm{color:var(--accentInk)}

.chead{display:flex;justify-content:space-between;align-items:center;font-size:10px;
       letter-spacing:.04em;gap:calc(var(--px)*1)}
.chead-r{display:flex;align-items:center;gap:calc(var(--px)*1);flex:none}
.no{color:var(--ink2);font-weight:700}
.mg{background:var(--accent);color:var(--accentInk);padding:0 calc(var(--px)*1);font-size:10px;
    letter-spacing:.04em;line-height:1.5}
.card[aria-current=true] .mg{background:var(--accentInk);color:var(--accent)}

/* Artwork is never recoloured in either mode — only upscaled without smoothing, so the
   96px source stays a crisp pixel grid. */
.sprite{width:96px;height:96px;margin:0 auto;image-rendering:pixelated}
.ph{width:96px;height:96px;margin:0 auto;image-rendering:pixelated}

.nm{font-size:13px;font-weight:700;letter-spacing:.02em;word-break:break-word;line-height:1.2}
/* The other language always stays on screen — the toggle changes which one leads, it
   does not hide the other. 10px because CJK is unreadable at the 8px the Latin face
   handles fine. */
.na{font-size:12px;color:var(--ink2);letter-spacing:.02em;line-height:1.25;
    word-break:break-word;min-height:15px}
.card[aria-current=true] .na{color:var(--accentInk)}
.fm{font-size:10px;color:var(--ink2);letter-spacing:.04em;line-height:1.3;min-height:13px}
.ty{display:flex;flex-wrap:wrap;gap:calc(var(--px)*1);font-size:10px;
    align-items:center;margin-top:auto;padding-top:calc(var(--px)*1)}
.ty span{display:flex;align-items:center;gap:2px;color:var(--ink2)}
.card[aria-current=true] .ty span{color:var(--accentInk)}
/* Colour is the whole point of MODERN: let the type name carry it. On the selected card
   the accent takes over, so the label matches the mark instead of fighting it. */
body.modern .ty span{color:var(--tc)}
.ty img{width:16px;height:16px;image-rendering:pixelated}

.tyr{margin-left:auto;flex:none;display:flex;align-items:center;gap:calc(var(--px)*1)}
/* Form count. A drawn badge rather than a box-drawing character: Silkscreen has no
   glyph for those, so they fall back to the system face and break the pixel grid. */
.fc{flex:none;font-size:10px;font-weight:700;letter-spacing:0;
    background:var(--ink2);color:var(--panel);padding:0 calc(var(--px)*1);line-height:1.6}
.card[aria-current=true] .fc{background:var(--accentInk);color:var(--accent)}
/* Shown only while sorting by stats, so the number that decided the order is visible. */
.bs{flex:none;font-size:11px;font-weight:700;letter-spacing:0;color:var(--ink)}
.card[aria-current=true] .bs{color:var(--accentInk)}

.empty{grid-column:1/-1;padding:calc(var(--px)*10);text-align:center;font-family:var(--prose);font-size:14px;color:var(--ink2)}

/* ---------- motion ----------
   Everything steps. A handheld of this era had no tweening: sprites and menus advanced
   frame by frame, so easing would read as the wrong decade. `steps()` keeps the movement
   quantised to the same grid the pixels sit on. Hover stays instant on purpose. */
@keyframes veilIn  {from{opacity:0} to{opacity:1}}
@keyframes panelIn {from{opacity:0;transform:translate(-50%,-50%) scale(.88)}
                    to  {opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes sheetIn {from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none}}
@keyframes cardIn  {from{opacity:0;transform:translateY(6px)}  to{opacity:1;transform:none}}
/* a sprite swap is a swap, not a crossfade — one blank frame sells the cartridge feel */
@keyframes swap    {0%{opacity:0} 50%{opacity:0} 100%{opacity:1}}

.veil.on{animation:veilIn .1s steps(2) both}
.panel.on{animation:panelIn .16s steps(3) both}
.big{animation:swap .14s steps(2) both}
/* the staggered reveal fires once, at boot — re-running it on every keystroke would make
   filtering feel slower, not livelier */
body.booting .card{animation:cardIn .22s steps(2) both;
                   animation-delay:calc(var(--i,0) * 14ms)}

@media (prefers-reduced-motion:reduce){
  .veil.on,.panel.on,.big,body.booting .card{animation:none}
}

/* ---------- detail ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:50;display:none}
.veil.on{display:block}
.panel{position:fixed;z-index:51;background:var(--panel);border:calc(var(--px)*2) solid var(--line);
       display:none;flex-direction:column;overflow:auto;
       top:50%;left:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));
       max-height:min(92vh,900px)}
.panel.on{display:flex}
.phead{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--px)*2);
        background:var(--accent);color:var(--accentInk);padding:calc(var(--px)*2) calc(var(--px)*3);
        position:sticky;top:0;z-index:2}
.phead h2{font-size:18px;font-weight:700;letter-spacing:.04em}
.phead .palt{font-size:13px;opacity:.85;letter-spacing:.02em;margin-top:1px}
.phead .pno{font-size:12px;opacity:.9;margin-top:2px}
.x{background:none;border:var(--px) solid var(--accentInk);color:var(--accentInk);width:28px;height:28px;
   cursor:pointer;font-size:13px;line-height:1;flex:none}
.x:hover{background:var(--accentInk);color:var(--accent)}
.pbody{padding:calc(var(--px)*4);display:flex;flex-direction:column;gap:calc(var(--px)*3)}

.stage{background:var(--surface2);box-shadow:inset 0 0 0 var(--px) var(--line);
       padding:calc(var(--px)*2);display:flex;flex-direction:column;align-items:center;
       gap:calc(var(--px)*1)}
body.modern .stage{background:var(--surface)}
.big{width:192px;height:192px;image-rendering:pixelated}
.stage .cap{font-size:12px;color:var(--ink);letter-spacing:.04em;text-align:center;min-height:14px}

/* form switcher */
.sw{display:flex;flex-direction:column;gap:calc(var(--px)*2)}
.swgrp{display:flex;flex-wrap:wrap;gap:calc(var(--px)*2);align-items:center}
.swgrp>.gl{font-size:11px;color:var(--ink2);letter-spacing:.08em;min-width:58px}
.fchip{background:var(--surface);border:var(--px) solid var(--ink2);color:var(--ink);
       padding:calc(var(--px)*1) calc(var(--px)*2);font-size:12px;cursor:pointer;
       line-height:1.3;letter-spacing:.02em;display:flex;align-items:center;gap:3px}
.fchip:hover{background:var(--surface2)}
.fchip[aria-pressed=true]{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.fchip img{width:14px;height:14px;image-rendering:pixelated}

dl.kv{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--px)*2) calc(var(--px)*3);
      font-size:13px;align-items:baseline}
dl.kv dt{color:var(--ink2);font-size:13px;letter-spacing:.04em;white-space:nowrap}
dl.kv dd{font-weight:700}
.tlist{display:flex;flex-wrap:wrap;gap:calc(var(--px)*2)}
.tpill{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;
       padding:1px calc(var(--px)*1);border:var(--px) solid var(--ink2);letter-spacing:.02em}
body.modern .tpill{background:var(--tc);color:var(--tcInk);border-color:var(--tc)}
.tpill img{width:14px;height:14px;image-rendering:pixelated}
.warn{font-family:var(--prose);font-optical-sizing:auto;font-size:13px;background:var(--accent);color:var(--accentInk);padding:calc(var(--px)*2);line-height:1.6}

/* ---------- section frame shared by stats / abilities / moves ---------- */
.sec{display:flex;flex-direction:column;gap:calc(var(--px)*2)}
.sech{display:flex;align-items:center;gap:calc(var(--px)*2);flex-wrap:wrap;
      border-bottom:var(--px) solid var(--ink2);padding-bottom:calc(var(--px)*1)}
.sech h3{font-size:13px;letter-spacing:.06em;font-weight:700}
.sech .cnt{font-size:12px;color:var(--ink2);font-weight:700}
.sech .sp{margin-left:auto;display:flex;gap:calc(var(--px)*1);align-items:center}
.mini{background:var(--surface);border:var(--px) solid var(--ink2);color:var(--ink);
      font-size:11px;padding:1px calc(var(--px)*1);cursor:pointer;line-height:1.4;letter-spacing:.02em}
.mini:hover{background:var(--surface2)}
.mini[aria-pressed=true]{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}

/* ---------- base stats ---------- */
.stats{display:grid;gap:2px}
.strow{display:grid;grid-template-columns:62px 38px 1fr;align-items:center;gap:calc(var(--px)*2);
       font-size:12px;min-height:22px}
.strow .k{color:var(--ink2);letter-spacing:.02em}
.strow .v{text-align:right;font-weight:700;font-size:13px}
/* The form's best stat earns emphasis — via colour and bar weight only, so the row
   height never changes. NB: must not be called `.top`; that name already belongs to the
   masthead, whose flex/border/margin would silently land on these rows. */
.strow.peak .k,.strow.peak .v{color:var(--ink)}
.bar{height:13px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--ink2);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink2);display:block}
.strow.peak .bar i{background:var(--ink)}
.sttotal{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);
         border-top:var(--px) solid var(--ink2);padding-top:calc(var(--px)*1);margin-top:2px}
.sttotal b{color:var(--ink);font-size:14px}

/* ---------- abilities ---------- */
.abil{display:flex;flex-direction:column;gap:calc(var(--px)*2)}
.ab{background:var(--surface);box-shadow:inset 0 0 0 var(--px) var(--ink2);
    padding:calc(var(--px)*2);display:flex;flex-direction:column;gap:2px}
.ab .ah{display:flex;align-items:baseline;gap:calc(var(--px)*2);flex-wrap:wrap}
.ab .an{font-size:14px;font-weight:700}
.ab .ae{font-size:11px;color:var(--ink2);letter-spacing:.02em}
.ab .hid{font-size:10px;background:var(--ink2);color:var(--panel);padding:0 calc(var(--px)*1);
         letter-spacing:.04em;line-height:1.6}
.ab .ad{font-family:var(--prose);font-optical-sizing:auto;font-size:13px;color:var(--ink2);
        line-height:1.6;letter-spacing:0}

/* ---------- moves ---------- */
.mvwrap{max-height:400px;overflow:auto;box-shadow:inset 0 0 0 var(--px) var(--ink2)}
.mvrow{display:grid;grid-template-columns:18px 1fr 28px 44px 44px 34px;
       align-items:center;gap:calc(var(--px)*1);padding:2px calc(var(--px)*2);font-size:12px}
.mvrow+.mvrow{border-top:1px solid var(--surface2)}
.mvrow.hd{position:sticky;top:0;background:var(--surface2);font-size:10px;color:var(--ink2);
          letter-spacing:.04em;z-index:1;border:none}
.mvrow img{width:16px;height:16px;image-rendering:pixelated}
.mvrow .mn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvrow .dc{font-size:11px;text-align:center;color:var(--ink2)}
.mvrow .num{text-align:right;font-size:11px;font-variant-numeric:tabular-nums}
.mvrow .dash{color:var(--ink2);opacity:.6}
/* STAB is the single most actionable thing about a move in a battle-only game */
.mvrow.stab{background:var(--surface2)}
.mvrow.stab .mn::after{content:"★";font-size:10px;margin-left:3px;vertical-align:top}
body.modern .mvrow .mn{color:var(--tc)}
.mvnone{padding:calc(var(--px)*3);font-family:var(--prose);font-size:13px;color:var(--ink2);text-align:center}

footer{margin-top:calc(var(--px)*4);font-family:var(--prose);font-size:13px;color:var(--ink2);
       line-height:1.75;letter-spacing:0;font-optical-sizing:auto}
/* the run-in labels stay on the pixel face, so each line reads label / prose */
footer b{font-family:var(--font);font-size:11px;letter-spacing:.04em}
footer b{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:520px){
  h1{font-size:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .sprite,.ph{width:80px;height:80px}
  .big{width:144px;height:144px}
  .panel{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:88vh;border-width:var(--px)}
  /* as a bottom sheet it has no centring transform to preserve, so it rises instead */
  .panel.on{animation-name:sheetIn}
  .swgrp>.gl{min-width:0;width:100%}
}

d":"讓對手感到緊張， 無法吃樹果。","de":"Unnerves opposing Pokémon and makes them unable to eat Berries."},{"n":"Static","z":"靜電","d":"身上帶有靜電， 有時會令接觸到的對手麻痺。","de":"The Pokémon is charged with static electricity and may paralyze attackers that make direct contact with it."},{"n":"Lightning Rod","z":"避雷針","d":"將電屬性的招式吸引到自己身上， 不但不會受到傷害，反而會提高特攻。","de":"The Pokémon draws in all Electric-type moves. Instead of taking damage from them, its Sp. Atk stat is boosted."},{"n":"Surge Surfer","z":"衝浪之尾","d":"電氣場地時， 速度會變為２倍。","de":"Doubles the Pokémon's Speed stat on Electric Terrain."},{"n":"Electric Surge","z":"電氣製造者","d":"出場時， 會布下電氣場地。","de":"Turns the ground into Electric Terrain when the Pokémon enters a battle."},{"n":"Cute Charm","z":"迷人之軀","d":"有時會讓接觸到自己的對手 陷入著迷狀態。","de":"The Pokémon may infatuate attackers that make direct contact with it."},{"n":"Magic Guard","z":"魔法防守","d":"不會受到攻擊以外的傷害。","de":"The Pokémon only takes damage from attacks."},{"n":"Unaware","z":"純樸","d":"可無視對手能力的變化， 進行攻擊。","de":"When attacking, the Pokémon ignores the target's stat changes."},{"n":"Magic Bounce","z":"魔法鏡","d":"可不受到由對手使出的 變化類招式所影響，並將其反彈。","de":"The Pokémon reflects status moves instead of getting hit by them."},{"n":"Flash Fire","z":"引火","d":"受到火屬性的招式攻擊時， 吸收火焰，讓自己使出的 火屬性招式變強。","de":"If hit by a Fire-type move, the Pokémon absorbs the flames and uses them to power up its own Fire-type moves."},{"n":"Snow Cloak","z":"雪隱","d":"天氣為冰雹時， 閃避率會提高。","de":"Boosts the Pokémon's evasiveness in snow."},{"n":"Snow Warning","z":"降雪","d":"出場時， 會將天氣變為冰雹。","de":"The Pokémon makes it snow when it enters a battle."},{"n":"Effect Spore","z":"孢子","d":"受到攻擊時， 有時會讓接觸到自己的對手 陷入中毒、麻痺或睡眠狀態。","de":"Contact with the Pokémon may inflict poison, sleep, or paralysis on the attacker."},{"n":"Justified","z":"正義之心","d":"受到惡屬性的招式攻擊時， 因為正義感，攻擊會提高。","de":"When the Pokémon is hit by a Dark-type attack, its Attack stat is boosted by its sense of justice."},{"n":"Rock Head","z":"堅硬腦袋","d":"即使使出會受反作用力傷害的招式， ＨＰ也不會減少。","de":"Protects the Pokémon from recoil damage."},{"n":"Synchronize","z":"同步","d":"將自己的中毒、麻痺或 灼傷狀態傳染給對手。","de":"If the Pokémon is burned, paralyzed, or poisoned by another Pokémon, that Pokémon will be inflicted with the same status condition."},{"n":"Inner Focus","z":"精神力","d":"靠著經過鍛鍊的精神， 不會因對手的攻擊而畏縮。","de":"The Pokémon's intense focus prevents it from flinching or being affected by Intimidate."},{"n":"Trace","z":"複製","d":"出場時，複製對手的特性， 變為與之相同的特性。","de":"When it enters a battle, the Pokémon copies an opposing Pokémon's Ability."},{"n":"Guts","z":"毅力","d":"陷入異常狀態時， 會拿出毅力， 攻擊會提高。","de":"It's so gutsy that having a status condition boosts the Pokémon's Attack stat."},{"n":"Steadfast","z":"不屈之心","d":"每次畏縮時， 不屈之心就會燃起， 速度也會提高。","de":"The Pokémon's determination boosts its Speed stat every time it flinches."},{"n":"Gluttony","z":"貪吃鬼","d":"原本ＨＰ變得很少時才會吃的樹果， 在ＨＰ還有一半時就會把它吃掉。","de":"If the Pokémon is holding a Berry to be eaten when its HP is low, it will instead eat the Berry when its HP drops to half or less."},{"n":"Innards Out","z":"飛出的內在物","d":"被對手打倒的時候， 會給予對手相當於 ＨＰ剩餘量的傷害。","de":"Damages the attacker landing the finishing hit by the amount equal to its last HP."},{"n":"Oblivious","z":"遲鈍","d":"感覺遲鈍， 不會陷入著迷和被挑釁狀態。","de":"The Pokémon is oblivious, keeping it from being infatuated, falling for taunts, or being affected by Intimidate."},{"n":"Own Tempo","z":"我行我素","d":"因為我行我素， 不會陷入混亂狀態。","de":"The Pokémon sticks to its own tempo, preventing it from becoming confused or being affected by Intimidate."},{"n":"Regenerator","z":"再生力","d":"退回同行隊伍後， ＨＰ會少量回復。","de":"The Pokémon has a little of its HP restored when withdrawn from battle."},{"n":"Quick Draw","z":"速擊","d":"有時能比對手先一步行動。","de":"Enables the Pokémon to move first occasionally."},{"n":"Shell Armor","z":"硬殼盔甲","d":"被堅硬的殼保護著， 對手的攻擊不會擊中要害。","de":"A hard shell protects the Pokémon from critical hits."},{"n":"Cursed Body","z":"詛咒之軀","d":"受到攻擊時， 有時會把對手的招式 變為定身法狀態。","de":"May disable a move that has dealt damage to the Pokémon."},{"n":"Shadow Tag","z":"踩影","d":"踩住對手的影子 使其無法逃走或替換。","de":"The Pokémon steps on the opposing Pokémon's shadows to prevent them from fleeing or switching out."},{"n":"Early Bird","z":"早起","d":"即使陷入睡眠狀態， 也能以２倍的速度提早醒來。","de":"The Pokémon awakens from sleep twice as fast as other Pokémon."},{"n":"Scrappy","z":"膽量","d":"一般屬性和格鬥屬性的招式 可擊中幽靈屬性的寶可夢。","de":"The Pokémon can hit Ghost-type Pokémon with Normal- and Fighting-type moves. It is also unaffected by Intimidate."},{"n":"Parental Bond","z":"親子愛","d":"親子倆可合計攻擊２次。","de":"Parent and child each attacks."},{"n":"Illuminate","z":"發光","d":"透過讓周圍變亮， 變得容易遇見野生的寶可夢。","de":"By illuminating its surroundings, the Pokémon prevents its accuracy from being lowered."},{"n":"Natural Cure","z":"自然回復","d":"異常狀態會在 離場後治癒。","de":"The Pokémon's status conditions are cured when it switches out."},{"n":"Analytic","z":"分析","d":"如果在最後使出招式， 招式的威力就會變強。","de":"Boosts the power of the Pokémon's move if it is the last to act that turn."},{"n":"Huge Power","z":"大力士","d":"物理攻擊的威力會變為２倍。","de":"Doubles the Pokémon's Attack stat."},{"n":"Hyper Cutter","z":"怪力鉗","d":"因為擁有以力量為傲的鉗子， 不會被對手降低攻擊。","de":"The Pokémon's prized, mighty pincers prevent other Pokémon from lowering its Attack stat."},{"n":"Mold Breaker","z":"破格","d":"可不受特性影響， 向對手使出招式。","de":"The Pokémon's moves are unimpeded by the Ability of the target."},{"n":"Moxie","z":"自信過度","d":"如果打倒對手， 會充滿自信並提高攻擊。","de":"When the Pokémon knocks out a target, it shows moxie, which boosts its Attack stat."},{"n":"Aerilate","z":"飛行皮膚","d":"一般屬性的招式 會變為飛行屬性。 威力會少量提高。","de":"Normal-type moves become Flying-type moves. The power of those moves is boosted a little."},{"n":"Anger Point","z":"憤怒穴位","d":"要害被擊中時會大發雷霆。 攻擊力會提高到最大。","de":"The Pokémon is angered when it takes a critical hit, and that maxes its Attack stat."},{"n":"Sheer Force","z":"強行","d":"招式會失去追加效果， 但可以用更高的威力使出招式。","de":"Removes any additional effects from the Pokémon's moves, but increases the moves' power."},{"n":"Cud Chew","z":"反芻","d":"","de":"When the Pokémon eats a Berry, it will regurgitate that Berry at the end of the next turn and eat it one more time."},{"n":"Limber","z":"柔軟","d":"因為身體柔軟， 不會陷入麻痺狀態。","de":"The Pokémon's limber body prevents it from being paralyzed."},{"n":"Imposter","z":"變身者","d":"變身為當前面對的寶可夢。","de":"The Pokémon transforms itself into the Pokémon it's facing."},{"n":"Water Absorb","z":"儲水","d":"受到水屬性的招式攻擊時， 不會受到傷害，而是會回復。","de":"If hit by a Water-type move, the Pokémon has its HP restored instead of taking damage."},{"n":"Hydration","z":"濕潤之軀","d":"天氣為下雨時， 會治癒異常狀態。","de":"Cures the Pokémon's status conditions in rain."},{"n":"Volt Absorb","z":"蓄電","d":"受到電屬性的招式攻擊時， 不會受到傷害，而是會回復。","de":"If hit by an Electric-type move, the Pokémon has its HP restored instead of taking damage."},{"n":"Quick Feet","z":"飛毛腿","d":"陷入異常狀態時， 速度會提高。","de":"Boosts the Speed stat if the Pokémon has a status condition."},{"n":"Pressure","z":"壓迫感","d":"給予對手壓迫感， 大量減少其使用招式的ＰＰ。","de":"Puts other Pokémon under pressure, causing them to expend more PP to use their moves."},{"n":"Immunity","z":"免疫","d":"因為體內擁有免疫能力， 不會陷入中毒狀態。","de":"The Pokémon's immune system prevents it from being poisoned."},{"n":"Multiscale","z":"多重鱗片","d":"ＨＰ全滿時， 受到的傷害會變少。","de":"Reduces the amount of damage the Pokémon takes while its HP is full."},{"n":"Leaf Guard","z":"葉子防守","d":"天氣為晴朗時， 不會陷入異常狀態。","de":"Prevents status conditions in harsh sunlight."},{"n":"Mega Sol","z":"超級日光","d":"","de":"Even when the sunlight has not turned harsh, the Pokémon can use its moves as if the weather were harsh sunlight."},{"n":"Frisk","z":"察覺","d":"出場時， 可以察覺對手的持有物。","de":"When it enters a battle, the Pokémon can check an opposing Pokémon's held item."},{"n":"Dragonize","z":"龍皮膚","d":"","de":"The Pokémon's Normal-type moves become Dragon-type moves and their power is boosted by 20%."},{"n":"Insomnia","z":"不眠","d":"因為有著睡不著的體質， 所以不會陷入睡眠狀態。","de":"The Pokémon's insomnia prevents it from falling asleep."},{"n":"Plus","z":"正電","d":"場上的夥伴之中， 如果有正電或負電特性的寶可夢， 自己的特攻會提高。","de":"Boosts the Sp. Atk stat of the Pokémon if an ally with the Plus or Minus Ability is also in battle."},{"n":"Sap Sipper","z":"食草","d":"受到草屬性的招式攻擊時， 不但不會受到傷害，反而攻擊會提高。","de":"The Pokémon takes no damage when hit by Grass-type moves. Instead, its Attack stat is boosted."},{"n":"Damp","z":"濕氣","d":"透過把周圍都弄濕， 使誰都無法使用自爆等爆炸類的招式。","de":"The Pokémon dampens its surroundings, preventing all Pokémon from using explosive moves such as Self-Destruct."},{"n":"Drizzle","z":"降雨","d":"出場時， 會將天氣變為下雨。","de":"The Pokémon makes it rain when it enters a battle."},{"n":"Curious Medicine","z":"怪藥","d":"出場時，會從貝殼撒藥， 將我方的能力變化復原。","de":"When the Pokémon enters a battle, it scatters medicine from its shell, which removes all stat changes from allies."},{"n":"Sturdy","z":"結實","d":"受到對手的招式攻擊時 不會被一擊打倒。 一擊必殺的招式也沒有效果。","de":"The Pokémon cannot be knocked out by a single hit as long as its HP is full. One-hit KO moves will also fail to knock it out."},{"n":"Overcoat","z":"防塵","d":"不會受到沙暴或冰雹等的傷害。 不會受到粉末類招式的攻擊。","de":"The Pokémon takes no damage from sandstorms. It is also protected from the effects of powders and spores."},{"n":"Sand Force","z":"沙之力","d":"天氣為沙暴時， 岩石屬性、地面屬性 和鋼屬性招式的威力會提高。","de":"Boosts the power of Rock-, Ground-, and Steel-type moves in a sandstorm."},{"n":"Poison Point","z":"毒刺","d":"有時會讓接觸到自己的 對手陷入中毒狀態。","de":"Contact with the Pokémon may poison the attacker."},{"n":"Swift Swim","z":"悠游自如","d":"天氣為下雨時， 速度會提高。","de":"Boosts the Pokémon's Speed stat in rain."},{"n":"Technician","z":"技術高手","d":"可讓威力低的招式 提高威力來進行攻擊。","de":"Powers up weak moves so the Pokémon can deal more damage with them."},{"n":"Light Metal","z":"輕金屬","d":"自己的重量會減半。","de":"Halves the Pokémon's weight."},{"n":"Skill Link","z":"連續攻擊","d":"使用連續招式時， 每回都能以最多次數進行攻擊。","de":"Maximizes the number of times multistrike moves hit."},{"n":"Weak Armor","z":"碎裂鎧甲","d":"因物理招式受到傷害時， 防禦會降低， 速度會大幅提高。","de":"The Pokémon's Defense stat is lowered when it takes damage from physical moves, but its Speed stat is sharply boosted."},{"n":"Stalwart","z":"堅毅","d":"能無視具有吸引 對手招式效果的 特性或招式的影響。","de":"Ignores the effects of opposing Pokémon's Abilities and moves that draw in moves."},{"n":"Sand Stream","z":"揚沙","d":"出場時， 會把天氣變為沙暴。","de":"The Pokémon summons a sandstorm when it enters a battle."},{"n":"Unburden","z":"輕裝","d":"失去所持有的道具時， 速度會提高。","de":"Boosts the Speed stat if the Pokémon's held item is used or lost."},{"n":"Speed Boost","z":"加速","d":"每一回合速度會變快。","de":"The Pokémon's Speed stat is boosted every turn."},{"n":"Telepathy","z":"心靈感應","d":"預測我方的攻擊， 並閃避其招式。","de":"The Pokémon anticipates and dodges the attacks of its allies."},{"n":"Pixilate","z":"妖精皮膚","d":"一般屬性的招式 會變為妖精屬性。 威力會少量提高。","de":"Normal-type moves become Fairy-type moves. The power of those moves is boosted a little."},{"n":"Stall","z":"慢出","d":"使出招式的順序 必定會變為最後。","de":"The Pokémon is always the last to use its moves."},{"n":"Prankster","z":"惡作劇之心","d":"可以搶先使出變化類招式。","de":"Gives priority to the Pokémon's status moves."},{"n":"Heavy Metal","z":"重金屬","d":"自己的重量會變為２倍。","de":"Doubles the Pokémon's weight."},{"n":"Filter","z":"過濾","d":"受到效果絕佳的攻擊時， 可減弱其威力。","de":"Reduces the power of supereffective attacks that hit the Pokémon."},{"n":"Pure Power","z":"瑜伽之力","d":"因瑜伽的力量， 物理攻擊的威力會變為２倍。","de":"Using its pure power, the Pokémon doubles its Attack stat."},{"n":"Minus","z":"負電","d":"場上的夥伴之中， 如果有正電或負電特性的寶可夢， 自己的特攻會提高。","de":"Boosts the Sp. Atk stat of the Pokémon if an ally with the Plus or Minus Ability is also in battle."},{"n":"Rough Skin","z":"粗糙皮膚","d":"受到攻擊時， 用粗糙的皮膚弄傷 接觸到自己的對手。","de":"The Pokémon's rough skin damages attackers that make direct contact with it."},{"n":"Strong Jaw","z":"強壯之顎","d":"顎部強壯， 會提高啃咬類招式的威力。","de":"The Pokémon's strong jaw boosts the power of its biting moves."},{"n":"Magma Armor","z":"熔岩鎧甲","d":"將熾熱的熔岩覆蓋在身上， 不會陷入冰凍狀態。","de":"The Pokémon’s hot magma coating prevents it from being frozen."},{"n":"Solid Rock","z":"堅硬岩石","d":"受到效果絕佳的攻擊時， 可減弱其威力。","de":"Reduces the power of supereffective attacks that hit the Pokémon."},{"n":"White Smoke","z":"白色煙霧","d":"被白色煙霧保護著， 不會被對手降低能力。","de":"The Pokémon is protected by its white smoke, which prevents other Pokémon from lowering its stats."},{"n":"Cloud Nine","z":"無關天氣","d":"任何天氣的影響都會消失。","de":"Eliminates the effects of weather."},{"n":"Marvel Scale","z":"神奇鱗片","d":"陷入異常狀態時， 神奇鱗片會發生反應， 防禦會提高。","de":"The Pokémon's marvelous scales boost its Defense stat if it has a status condition."},{"n":"Competitive","z":"好勝","d":"能力被降低時， 特攻會大幅提高。","de":"Boosts the Pokémon's Sp. Atk stat sharply when its stats are lowered by an opposing Pokémon."},{"n":"Forecast","z":"陰晴不定","d":"在天氣的影響下， 會變成水屬性、火屬性 或冰屬性之中的一種。","de":"The Pokémon transforms with the weather to change its type to Water, Fire, or Ice."},{"n":"Levitate","z":"飄浮","d":"從地面浮起， 從而不會受到地面屬性招式的攻擊。","de":"By floating in the air, the Pokémon receives full immunity to all Ground-type moves."},{"n":"Super Luck","z":"超幸運","d":"因為非常幸運， 容易擊中對手的要害。","de":"The Pokémon is so lucky that the critical-hit ratios of its moves are boosted."},{"n":"Ice Body","z":"冰凍之軀","d":"天氣為冰雹時， 會漸漸回復ＨＰ。","de":"The Pokémon gradually regains HP in snow."},{"n":"Moody","z":"心情不定","d":"每一回合，能力中的某項 會大幅提高，相對地某項會降低。","de":"Every turn, one of the Pokémon's stats will be boosted sharply but another stat will be lowered."},{"n":"Refrigerate","z":"冰凍皮膚","d":"一般屬性的招式 會變為冰屬性。 威力會少量提高。","de":"Normal-type moves become Ice-type moves. The power of those moves is boosted a little."},{"n":"Clear Body","z":"恆淨之軀","d":"不會因對手的招式或特性 而被降低能力。","de":"Prevents other Pokémon's moves or Abilities from lowering the Pokémon's stats."},{"n":"Iron Fist","z":"鐵拳","d":"使用到拳頭的招式 威力會提高。","de":"Powers up punching moves."},{"n":"Reckless","z":"捨身","d":"會讓自己因反作用力而受傷的招式 威力會提高。","de":"Powers up moves that have recoil damage."},{"n":"Contrary","z":"唱反調","d":"能力的變化會逆轉， 原本提高時會降低， 原本降低時會提高。","de":"Reverses any stat changes affecting the Pokémon so that attempts to boost its stats instead lower them—and attempts to lower its stats will boost them."},{"n":"Rivalry","z":"鬥爭心","d":"面對性別相同的對手， 會燃起鬥爭心，變得更強。 面對性別不同的對手時則會變弱。","de":"The Pokémon's competitive spirit makes it deal more damage to Pokémon of the same gender, but less damage to Pokémon of the opposite gender."},{"n":"Soundproof","z":"隔音","d":"透過遮蔽聲音， 不受到聲音招式的攻擊。","de":"Soundproofing gives the Pokémon full immunity to all sound-based moves."},{"n":"Klutz","z":"笨拙","d":"無法使用持有的道具。","de":"The Pokémon can't use any held items."},{"n":"Infiltrator","z":"穿透","d":"可穿透對手的屏障 或替身進行攻擊。","de":"The Pokémon's moves are unaffected by the target's barriers, substitutes, and the like."},{"n":"Sand Veil","z":"沙隱","d":"在沙暴中 閃避率會提高。","de":"Boosts the Pokémon's evasiveness in a sandstorm."},{"n":"Anticipation","z":"危險預知","d":"察覺對手持有的 危險招式。","de":"The Pokémon can sense an opposing Pokémon's dangerous moves."},{"n":"Dry Skin","z":"乾燥皮膚","d":"下雨天氣時和受到水屬性的招式攻擊時， ＨＰ會回復。晴朗天氣時和受到火屬性的 招式攻擊時，ＨＰ會減少。","de":"Restores the Pokémon's HP in rain or when it is hit by Water-type moves. Reduces HP in harsh sunlight, and increases the damage received from Fire-type moves."},{"n":"Poison Touch","z":"毒手","d":"有時僅是接觸 就能讓對手中毒。","de":"May poison a target when the Pokémon makes contact."},{"n":"Pickpocket","z":"順手牽羊","d":"盜取接觸到自己的 對手的道具。","de":"The Pokémon steals the held item from attackers that made direct contact with it."},{"n":"Poison Heal","z":"毒療","d":"陷入中毒狀態時， ＨＰ不會減少，反而會漸漸增加。","de":"If poisoned, the Pokémon has its HP restored instead of taking damage."},{"n":"Sharpness","z":"鋒銳","d":"","de":"Powers up slicing moves."},{"n":"Forewarn","z":"預知夢","d":"出場時，預見１個 對手持有的招式。","de":"When it enters a battle, the Pokémon can tell one of the moves an opposing Pokémon has."},{"n":"Sand Rush","z":"撥沙","d":"天氣為沙暴時， 速度會提高。","de":"Boosts the Pokémon's Speed stat in a sandstorm."},{"n":"Piercing Drill","z":"貫穿鑽","d":"","de":"When the Pokémon uses contact moves, it can hit even targets that are protecting themselves, dealing 1/4 of the damage that the move would otherwise deal. Everything aside from the target's protective effects is still triggered."},{"n":"Healer","z":"治癒之心","d":"有時會治癒同伴的異常狀態。","de":"Sometimes cures the status conditions of the Pokémon's allies."},{"n":"Mummy","z":"木乃伊","d":"被對手接觸到時， 會將對手變成木乃伊。","de":"Contact with the Pokémon changes the attacker’s Ability to Mummy."},{"n":"Stench","z":"惡臭","d":"發出臭氣， 在攻擊的時候， 有時會使對手畏縮。","de":"By releasing a stench when attacking, the Pokémon may cause the target to flinch."},{"n":"Aftermath","z":"引爆","d":"瀕死時， 會對接觸到自己的對手造成傷害。","de":"Damages the attacker if it knocks out the Pokémon with a move that makes direct contact."},{"n":"Illusion","z":"幻覺","d":"假扮成同行隊伍中的 最後一隻寶可夢出場， 迷惑對手。","de":"The Pokémon fools opponents by entering battle disguised as the last Pokémon in its Trainer's party."},{"n":"Motor Drive","z":"電氣引擎","d":"受到電屬性的招式攻擊時， 不但不會受到傷害，反而速度會提高。","de":"The Pokémon takes no damage when hit by Electric-type moves. Instead, its Speed stat is boosted."},{"n":"Eelevate","z":"","d":"","de":"The Pokémon floats off the ground, making it immune to Ground-type moves, as well as the Spikes, Toxic Spikes, and Sticky Web statuses. When the Pokémon knocks out a target with an attack, its highest stat is boosted by 1 stage."},{"n":"Flame Body","z":"火焰之軀","d":"有時會讓接觸到自己的 對手陷入灼傷狀態。","de":"Contact with the Pokémon may burn the attacker."},{"n":"Slush Rush","z":"撥雪","d":"天氣為冰雹時， 速度會提高。","de":"Boosts the Pokémon's Speed stat in snow."},{"n":"Mimicry","z":"擬態","d":"寶可夢的屬性會隨著 場地的狀態而改變。","de":"Changes the Pokémon’s type depending on the terrain."},{"n":"Unseen Fist","z":"無形拳","d":"只要是接觸到對手的招式， 就可以無視對手的防守效果進行攻擊。","de":"If the Pokémon uses moves that make direct contact, it can attack the target even if the target protects itself."},{"n":"Bulletproof","z":"防彈","d":"可防住對手的 球和彈類的招式。","de":"Protects the Pokémon from ball and bomb moves."},{"n":"Magician","z":"魔術師","d":"奪走被自己招式 擊中的對手的道具。","de":"The Pokémon steals the held item from any target it hits with a move."},{"n":"Protean","z":"變幻自如","d":"變為與自己使出的招式 相同的屬性。","de":"Changes the Pokémon's type to the type of the move it's about to use. This works only once each time the Pokémon enters battle."},{"n":"Pickup","z":"撿拾","d":"有時會撿來對手用過的道具。 冒險過程中也會撿來。","de":"The Pokémon may pick up an item another Pokémon used during a battle. It may pick up items outside of battle, too."},{"n":"Cheek Pouch","z":"頰囊","d":"無論是哪種樹果， 吃下去後ＨＰ都會回復。","de":"The Pokémon's HP is restored when it eats any Berry, in addition to the Berry's usual effect."},{"n":"Gale Wings","z":"疾風之翼","d":"ＨＰ全滿時， 可以搶先在對手之前 使出飛行屬性的招式。","de":"Gives priority to the Pokémon's Flying-type moves while its HP is full."},{"n":"Shield Dust","z":"鱗粉","d":"被鱗粉守護著， 不會受到招式的追加效果影響。","de":"Protective dust shields the Pokémon from the additional effects of moves."},{"n":"Compound Eyes","z":"複眼","d":"因為擁有複眼， 會提高招式的命中率。","de":"The Pokémon's compound eyes boost its accuracy."},{"n":"Friend Guard","z":"友情防守","d":"可以減少我方受到的傷害。","de":"Reduces damage dealt to allies."},{"n":"Fire Mane","z":"","d":"","de":"Boosts the power of the Pokémon's Fire-type moves by 50%."},{"n":"Flower Veil","z":"花幕","d":"我方的草屬性寶可夢 能力不會降低。 也不會陷入異常狀態。","de":"Ally Grass-type Pokémon are protected from status conditions and the lowering of their stats."},{"n":"Symbiosis","z":"共生","d":"同伴使用道具時， 會把自己持有的道具交給同伴。","de":"The Pokémon passes its held item to an ally that has used up an item."},{"n":"Fairy Aura","z":"妖精氣場","d":"全體的妖精屬性招式變強。","de":"Powers up each Pokémon’s Fairy-type moves."},{"n":"Fur Coat","z":"毛皮大衣","d":"對手的物理招式造成的 傷害會減半。","de":"Halves the damage from physical moves."},{"n":"Stance Change","z":"戰鬥切換","d":"若使出攻擊招式，會變為刀劍形態， 若使出招式「王者盾牌」， 會變為盾牌形態。","de":"The Pokémon changes its form to Blade Forme when it uses an attack move and changes to Shield Forme when it uses King’s Shield."},{"n":"Aroma Veil","z":"芳香幕","d":"可防住向自己和同伴 發出的心靈攻擊。","de":"Protects the Pokémon and its allies from effects that prevent the use of moves."},{"n":"Sweet Veil","z":"甜幕","d":"我方的寶可夢 不會陷入睡眠狀態。","de":"Prevents the Pokémon and its allies from falling asleep."},{"n":"Suction Cups","z":"吸盤","d":"用吸盤將自己牢牢吸附在地面上， 讓替換寶可夢的招式和道具失效。","de":"The Pokémon uses suction const SPRITES = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';

let REMOTE = null;                       // null = undecided, true/false = settled
const state = {q:'', gens:new Set(), types:new Set(), mega:false, multi:false,
               mode:0, sel:null, form:0, sort:'dex', mvSort:'name', mvStab:false, lang:'zh'};
const bst = form => form.st.reduce((a,b)=>a+b, 0);
/* A species' sort weight is its strongest form — sorting by the base form would bury
   every Mega, which is the opposite of what someone sorting by stats wants. */
const bestBst = sp => Math.max(...sp.f.map(bst));
const glyphCache = new Map(), phCache = new Map();

const $  = s => document.querySelector(s);
const el = (t,c) => { const n=document.createElement(t); if(c) n.className=c; return n; };
const rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const spName = sp => state.lang === 'zh' ? sp.mz : sp.m;
const spAlt  = sp => state.lang === 'zh' ? sp.m  : sp.mz;
const formLabel = f => (state.lang === 'zh' ? f.lz : f.l) || t('baseForm');
const formAlt   = f => (state.lang === 'zh' ? f.l : f.lz) || '';
const typeName  = ty => state.lang === 'zh' ? (TYPE_ZH[ty] || ty) : ty;
const mode = () => MODES[state.mode];

const relLum = hexc => {
  const [r,g,b] = rgb(hexc).map(v=>{ v/=255; return v<=.03928 ? v/12.92 : ((v+.055)/1.055)**2.4; });
  return .2126*r + .7152*g + .0722*b;
};
const contrast = (a,b) => {
  const [hi,lo] = [relLum(a), relLum(b)].sort((x,y)=>y-x);
  return (hi + .05) / (lo + .05);
};
/* Pick whichever ink actually contrasts better, rather than guessing at a luminance
   cut-off: a mid-tone like Rock's #AFA981 sits right at the crossover, and a fixed
   threshold hands it white — which is the worse of the two by a factor of four. */
function inkOn(bgHex){
  return contrast('#101010', bgHex) >= contrast('#ffffff', bgHex) ? '#101010' : '#ffffff';
}

/* token set for the active mode + quantiser table refresh */
function applyMode(){
  const m = mode();
  const tk = m.tokens || {
    bg:m.tones[0], shell:m.tones[1], panel:m.tones[3], surface:m.tones[3],
    surface2:m.tones[2], ink:m.tones[0], ink2:m.tones[1], line:m.tones[0],
    accent:m.tones[0], accentInk:m.tones[3],
  };
  const r = document.documentElement.style;
  Object.entries(tk).forEach(([k,v])=>r.setProperty('--'+k, v));
  document.body.classList.toggle('modern', !m.tones);
  glyphCache.clear(); phCache.clear(); tileCache.clear();
  r.setProperty('--dither-a', ditherTile(DITHER_SPARSE));
  r.setProperty('--dither-b', ditherTile(DITHER_DENSE));
  document.querySelectorAll('#modes .chip').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.mode === m.id)));
  render();
  paintTypeChips();
  if (state.sel) openDetail(state.sel, state.form, true);
}

/* A type mark is a bitmap, so its colour is baked in at draw time and cannot inherit
   anything. It must therefore be chosen against the surface it will sit on — drawing it
   in the type's own colour on a chip whose background IS that colour makes it vanish.
   `bg` names that surface: 'surface' | 'accent' | 'typechip'. */
function glyphOn(type, bg){
  const m = mode();
  if (!m.typeColor) return bg === 'accent' ? m.tones[3] : m.tones[0];
  if (bg === 'typechip') return inkOn(TYPE_COLORS[type] || '#888888');
  if (bg === 'accent')   return m.tokens.accentInk;
  return TYPE_COLORS[type] || m.tokens.ink;
}
function glyph(type, bg){
  bg = bg || 'surface';
  const key = mode().id + ':' + type + ':' + bg;
  if (glyphCache.has(key)) return glyphCache.get(key);
  const rows = GLYPHS[type] || GLYPHS.Normal;
  const cv = el('canvas'); cv.width = cv.height = 8;
  const g = cv.getContext('2d');
  g.fillStyle = glyphOn(type, bg);
  rows.forEach((r,y)=>{ for(let x=0;x<8;x++) if(r[x]==='#') g.fillRect(x,y,1,1); });
  const u = cv.toDataURL();
  glyphCache.set(key,u); return u;
}

/* Ordered-dither tiles as data URIs. Canvas keeps them pixel-exact — a CSS gradient
   checkerboard antialiases on fractional device pixels and turns to mush. */
const tileCache = new Map();
function ditherTile(dots){
  const m = mode();
  const key = m.id + ':' + dots.length;
  if (tileCache.has(key)) return tileCache.get(key);
  const cv = el('canvas'); cv.width = cv.height = 4;
  const g = cv.getContext('2d');
  g.fillStyle = m.tones ? m.tones[1] : m.tokens.shell;
  dots.forEach(([x,y])=>g.fillRect(x,y,1,1));
  const u = `url(${cv.toDataURL()})`;
  tileCache.set(key,u); return u;
}
/* 2/16 everywhere for a faint grain; 8/16 in the masked vignette layer */
const DITHER_SPARSE = [[0,0],[2,2]];
const DITHER_DENSE  = [[0,0],[2,0],[1,1],[3,1],[0,2],[2,2],[1,3],[3,3]];

/* drawn placeholder for when remote art is unavailable */
function placeholder(form){
  const key = mode().id + ':' + form.s;
  if (phCache.has(key)) return phCache.get(key);
  const m = mode();
  const P = m.tones || [m.tokens.line, m.tokens.ink2, m.tokens.surface2, m.tokens.surface];
  const N = 48;
  const cv = el('canvas'); cv.width = cv.height = N;
  const g = cv.getContext('2d');
  g.fillStyle = P[2]; g.fillRect(0,0,N,N);
  g.fillStyle = P[1];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(((x>>1)+(y>>1))%2===0) g.fillRect(x,y,1,1);
  g.fillStyle = P[0];
  g.fillRect(0,0,N,2); g.fillRect(0,N-2,N,2); g.fillRect(0,0,2,N); g.fillRect(N-2,0,2,N);
  g.fillStyle = m.typeColor ? (TYPE_COLORS[form.t[0]] || P[0]) : P[0];
  const rows = GLYPHS[form.t[0]] || GLYPHS.Normal, s = 4, o = (N - 8*s)/2;
  rows.forEach((r,y)=>{ for(let x=0;x<8;x++) if(r[x]==='#') g.fillRect(o+x*s, o+y*s, s, s); });
  const u = cv.toDataURL();
  phCache.set(key,u); return u;
}

function spriteNode(form, cls, size){
  const mk = c => { const i = el('img', c); i.width = i.height = size; i.alt = ''; return i; };
  if (REMOTE === false){ const p = mk('ph'); p.src = placeholder(form); return p; }
  const i = mk(cls);
  i.loading = 'lazy'; i.decoding = 'async';
  i.src = SPRITES + form.s;
  i.addEventListener('error', ()=>{
    const p = mk(cls === 'sprite' ? 'ph' : cls);
    p.src = placeholder(form); i.replaceWith(p);
  }, {once:true});
  return i;
}

function typeRow(types, bg){
  const w = el('div','ty');
  types.forEach(t=>{
    const s = el('span'); s.title = typeName(t) + ' ' + t;
    s.style.setProperty('--tc', TYPE_COLORS[t] || 'currentColor');
    const g = el('img'); g.src = glyph(t, bg); g.alt=''; g.width = g.height = 16;
    const lab = el('em'); lab.style.fontStyle='normal'; lab.textContent = TYPE_ABBR[t] || t;
    s.append(g, lab); w.append(s);
  });
  return w;
}

/* ---- filtering ---- */
const allTypes = sp => new Set(sp.f.flatMap(f=>f.t));
const hasMega  = sp => sp.f.some(f=>f.k==='mega');

/* Search always spans BOTH languages regardless of the active one — typing "噴火龍"
   while in English mode, or "charizard" while in Chinese, should both work. */
function haystack(sp){
  const at = [...allTypes(sp)];
  return [sp.m, sp.mz, sp.gz, String(sp.d), String(sp.d).padStart(4,'0'),
          'gen'+sp.g, GEN_ROMAN[sp.g],
          ...sp.f.map(f=>f.l), ...sp.f.map(f=>f.lz),
          ...at, ...at.map(x=>TYPE_ZH[x]||'')].join(' ').toLowerCase();
}
function match(sp){
  if (state.gens.size && !state.gens.has(sp.g)) return false;
  // types are matched across ALL forms, so consolidating never hides a typing
  if (state.types.size){
    const at = allTypes(sp);
    if (![...state.types].some(t=>at.has(t))) return false;
  }
  if (state.mega  && !hasMega(sp)) return false;
  if (state.multi && sp.f.length < 2) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  const hay = haystack(sp);
  return q.split(/\s+/).every(tok => hay.includes(tok));
}

/* Which form a card should show. If a filter or the query singled out a non-default
   form, show THAT one — otherwise the grid would answer "Dragon?" with a Fire/Flying
   picture and look wrong. */
function displayIndex(sp){
  const q = state.q.trim().toLowerCase();
  if (q){
    const toks = q.split(/\s+/);
    const hits = f => { const s = ((f.l || '') + ' ' + (f.lz || '')).toLowerCase();
                        return f.l && toks.every(tok => s.includes(tok)); };
    const i = sp.f.findIndex(hits);
    if (i >= 0) return i;
  }
  if (state.types.size){
    const i = sp.f.findIndex(f => f.t.some(t => state.types.has(t)));
    if (i >= 0) return i;
  }
  if (state.mega){
    const i = sp.f.findIndex(f => f.k === 'mega');
    if (i >= 0) return i;
  }
  return 0;
}

const SORTS = [['dex','sortDex'],['bst','sortBst'],['name','sortName']];
function render(){
  const grid = $('#grid');
  grid.textContent = '';
  const rows = DEX.species.filter(match);
  if (state.sort === 'bst')       rows.sort((a,b)=> bestBst(b) - bestBst(a) || a.d - b.d);
  else if (state.sort === 'name') rows.sort((a,b)=> spName(a).localeCompare(spName(b), state.lang === 'zh' ? 'zh-Hant' : 'en'));
  $('#count').textContent = t('count')(rows.length, DEX.species.length);
  if (!rows.length){
    const d = el('div','empty'); d.textContent = t('empty');
    grid.append(d); return;
  }
  const frag = document.createDocumentFragment();
  rows.forEach((sp,idx)=>{
    const fi = displayIndex(sp), form = sp.f[fi];
    const c = el('button','card'); c.type='button';
    const isSel = state.sel === sp;
    if (isSel) c.setAttribute('aria-current','true');

    const h = el('div','chead');
    const no = el('span','no'); no.textContent = 'No.' + String(sp.d).padStart(4,'0');
    const right = el('span','chead-r');
    if (hasMega(sp)){
      const megaForms = sp.f.filter(f=>f.k==='mega');
      const m = el('span','mg');
      m.textContent = '★' + (megaForms.length>1 ? megaForms.length : '');
      m.title = megaForms.map(f=>f.l).join(' / ');
      right.append(m);
    }
    const g = el('span','no'); g.textContent = GEN_ROMAN[sp.g]; right.append(g);
    h.append(no, right);

    const nm = el('div','nm'); nm.textContent = spName(sp);
    const na = el('div','na'); na.textContent = spAlt(sp);
    const fm = el('div','fm'); fm.textContent = form.l ? formLabel(form) : '';
    if (form.l) fm.title = formAlt(form);

    const ty = typeRow(form.t, isSel ? 'accent' : 'surface');
    const rt = el('span','tyr');
    if (state.sort === 'bst'){
      const b = el('span','bs');
      b.textContent = bestBst(sp);
      b.title = t('bstTitle');
      rt.append(b);
    }
    if (sp.f.length > 1){
      const fc = el('span','fc');
      fc.textContent = String(sp.f.length);
      fc.title = t('formsTitle')(sp.f.length);
      rt.append(fc);
    }
    if (rt.childElementCount) ty.append(rt);
    c.append(h, spriteNode(form,'sprite',96), nm, na, fm, ty);
    // capped: 208 * 14ms would leave the last card waiting three seconds
    c.style.setProperty('--i', Math.min(idx, 26));
    c.addEventListener('click', ()=>openDetail(sp, fi));
    frag.append(c);
  });
  grid.append(frag);
}

/* ---- detail sections: stats, abilities, Champions learnset ---- */
function sectionHead(title, count){
  const h = el('div','sech');
  const t = el('h3'); t.textContent = title; h.append(t);
  if (count != null){ const c = el('span','cnt'); c.textContent = count; h.append(c); }
  return h;
}

function statsSection(form){
  const s = el('div','sec');
  s.append(sectionHead(t('secStats')));
  const g = el('div','stats');
  const peak = Math.max(...form.st);
  form.st.forEach((v,i)=>{
    const r = el('div','strow');
    if (v === peak) r.classList.add('peak');
    const k = el('span','k'); k.textContent = t('stats')[i];
    const n = el('span','v'); n.textContent = v;
    const b = el('div','bar'); const fill = el('i');
    fill.style.width = Math.max(2, Math.round(Math.min(v, STAT_MAX) / STAT_MAX * 100)) + '%';
    b.append(fill);
    r.append(k, n, b); g.append(r);
  });
  const tot = el('div','sttotal');
  const tl = el('span'); tl.textContent = t('total');
  const tv = el('b'); tv.textContent = bst(form);
  tot.append(tl, tv);
  s.append(g, tot);
  return s;
}

function abilitiesSection(form){
  const s = el('div','sec');
  s.append(sectionHead(t('secAbil'), form.ab.length));
  const list = el('div','abil');
  form.ab.forEach(ref=>{
    const a = DEX.abilities[ref[0]], hidden = ref.length > 1;
    const box = el('div','ab');
    const ah = el('div','ah');
    const primary = state.lang === 'zh' ? (a.z || a.n) : a.n;
    const secondary = state.lang === 'zh' ? (a.z ? a.n : '') : (a.z || '');
    const n = el('span','an'); n.textContent = primary; ah.append(n);
    if (secondary){ const e = el('span','ae'); e.textContent = secondary; ah.append(e); }
    if (hidden){ const hb = el('span','hid'); hb.textContent = t('hidden'); ah.append(hb); }
    box.append(ah);
    const desc = state.lang === 'zh' ? (a.d || a.de) : (a.de || a.d);
    if (desc){ const d = el('div','ad'); d.textContent = desc; box.append(d); }
    list.append(box);
  });
  s.append(list);
  return s;
}

const MV_SORTS = [['name','mvName'],['power','mvPower'],['type','mvType']];
function movesSection(sp, form){
  const own = new Set(form.t);
  // STAB only applies to damaging moves, so a same-type Status move must not be marked
  const all = (sp.sec[form.si] || []).map(i=>{
    const m = DEX.moves[i];
    return {...m, stab: own.has(m.ty) && m.dc !== 'Status'};
  });
  const rows = state.mvStab ? all.filter(r=>r.stab) : all.slice();
  const byName = (a,b)=> a.n.localeCompare(b.n);
  rows.sort({
    name:  byName,
    power: (a,b)=> ((b.pw ?? -1) - (a.pw ?? -1)) || byName(a,b),
    type:  (a,b)=> (TYPE_ORDER.indexOf(a.ty) - TYPE_ORDER.indexOf(b.ty)) || byName(a,b),
  }[state.mvSort]);

  const s = el('div','sec');
  const h = sectionHead(t('secMoves'), all.length + (state.mvStab ? ' → ' + rows.length : ''));
  const sp2 = el('span','sp');
  MV_SORTS.forEach(([k,lab])=>{
    const b = el('button','mini'); b.type='button'; b.textContent = t(lab);
    b.setAttribute('aria-pressed', String(state.mvSort === k));
    b.addEventListener('click', ()=>{ state.mvSort = k; openDetail(sp, state.form, true); });
    sp2.append(b);
  });
  const st = el('button','mini'); st.type='button'; st.textContent = t('mvStab');
  st.title = t('mvStabTitle');
  st.setAttribute('aria-pressed', String(state.mvStab));
  st.addEventListener('click', ()=>{ state.mvStab = !state.mvStab; openDetail(sp, state.form, true); });
  sp2.append(st);
  h.append(sp2);
  s.append(h);

  const wrap = el('div','mvwrap');
  const hd = el('div','mvrow hd');
  t('mvHead').forEach((lab,i)=>{
    const c = el('span', i >= 3 ? 'num' : (i === 2 ? 'dc' : ''));
    c.textContent = lab; hd.append(c);
  });
  wrap.append(hd);

  if (!rows.length){
    const n = el('div','mvnone'); n.textContent = t('mvNone');
    wrap.append(n);
  }
  rows.forEach(m=>{
    const r = el('div','mvrow');
    if (m.stab) r.classList.add('stab');
    r.style.setProperty('--tc', TYPE_COLORS[m.ty] || 'currentColor');
    const g = el('img'); g.src = glyph(m.ty); g.alt=''; g.width = g.height = 16;
    g.title = typeName(m.ty) + ' ' + m.ty;
    // one name column only; the other language rides along in the tooltip
    const zn = el('span','mn');
    zn.textContent = state.lang === 'zh' ? (m.z || m.n) : m.n;
    const other = state.lang === 'zh' ? m.n : (m.z || '');
    zn.title = other ? `${zn.textContent}　${other}` : zn.textContent;
    const dc = el('span','dc'); dc.textContent = t('dc')[m.dc] || '?';
    dc.title = t('dcFull')[m.dc] || m.dc;
    const mk = v => { const c = el('span','num');
      if (v == null){ c.textContent = '—'; c.classList.add('dash'); } else c.textContent = v;
      return c; };
    r.append(g, zn, dc, mk(m.pw), mk(m.ac), mk(m.pp));
    wrap.append(r);
  });
  s.append(wrap);
  return s;
}

/* ---- detail with form switcher ---- */
function openDetail(sp, formIdx, keepScroll){
  state.sel = sp;
  state.form = Math.max(0, Math.min(formIdx || 0, sp.f.length - 1));
  const form = sp.f[state.form];
  const p = $('#panel');
  const y = keepScroll ? p.scrollTop : 0;
  p.textContent = '';

  const head = el('div','phead');
  const wrap = el('div');
  const h2 = el('h2'); h2.id='pt'; h2.textContent = spName(sp);
  const alt = el('div','palt'); alt.textContent = spAlt(sp);
  const pno = el('div','pno');
  pno.textContent = 'No.' + String(sp.d).padStart(4,'0') + ' ・ ' + t('genOf')(GEN_ROMAN[sp.g])
                  + (sp.f.length > 1 ? ' ・ ' + t('formsOf')(sp.f.length) : '')
                  + (state.lang === 'zh' && sp.gz ? ' ・ ' + sp.gz : '');
  wrap.append(h2, alt, pno);
  const x = el('button','x'); x.type='button'; x.textContent='✕';
  x.setAttribute('aria-label', t('close')); x.addEventListener('click', closeDetail);
  head.append(wrap, x);

  const b = el('div','pbody');

  const stage = el('div','stage');
  stage.append(spriteNode(form,'big',192));
  const cap = el('div','cap'); cap.textContent = formLabel(form);
  stage.append(cap);
  b.append(stage);

  // switcher, grouped by kind so 20 Vivillon patterns stay navigable
  if (sp.f.length > 1){
    const sw = el('div','sw');
    const order = ['base','other','regional','mega'];
    // A type mark on a chip should mean "this form retypes the Pokémon". Stamping all
    // 20 Vivillon patterns with the same Bug/Flying pair would be pure noise.
    const baseSig = sp.f[0].t.join('/');
    order.forEach(kind=>{
      const items = sp.f.map((f,i)=>[f,i]).filter(([f])=>f.k===kind);
      if (!items.length) return;
      const grp = el('div','swgrp');
      const gl = el('span','gl'); gl.textContent = t('kind')[kind];
      grp.append(gl);
      items.forEach(([f,i])=>{
        const on = i === state.form;
        const btn = el('button','fchip'); btn.type='button';
        btn.setAttribute('aria-pressed', String(on));
        if (f.k === 'mega'){ const s = el('span'); s.textContent='★'; btn.append(s); }
        const t = el('span'); t.textContent = formLabel(f); btn.append(t);
        if (f.t.join('/') !== baseSig){
          btn.title = f.t.map(typeName).join('/');
          f.t.forEach(ty=>{ const g=el('img'); g.src=glyph(ty, on ? 'accent' : 'surface');
                            g.alt=''; g.width=g.height=14; btn.append(g); });
        }
        btn.addEventListener('click', ()=>openDetail(sp, i, true));
        grp.append(btn);
      });
      sw.append(grp);
    });
    b.append(sw);
  }

  const dl = el('dl','kv');
  const dt = k => { const d=el('dt'); d.textContent=k; dl.append(d); };
  const put = (k,v) => { dt(k); const dd=el('dd'); dd.textContent=v; dl.append(dd); };

  dt(t('dTypes'));
  const tdd = el('dd'); const tl = el('div','tlist');
  form.t.forEach(t=>{
    const pill = el('span','tpill');
    pill.style.setProperty('--tc', TYPE_COLORS[t] || 'transparent');
    pill.style.setProperty('--tcInk', inkOn(TYPE_COLORS[t] || '#888888'));
    // the pill is filled with the type colour in MODERN, bare-bordered in POCKET
    const g = el('img'); g.src = glyph(t, mode().typeColor ? 'typechip' : 'surface');
    g.alt=''; g.width=g.height=14;
    const s = el('span'); s.textContent = state.lang === 'zh' ? typeName(t) + ' ' + t : t;
    pill.append(g, s); tl.append(pill);
  });
  tdd.append(tl); dl.append(tdd);

  put(t('dForm'), formLabel(form) + '（' + t('kind')[form.k] + '）'
                  + (formAlt(form) ? '　' + formAlt(form) : ''));
  put(t('dVer'), 'v' + (form.v || sp.v));
  const cur = form.x ? false : (form.k === 'base' ? !sp.x : true);
  put(t('dRoster'), cur ? t('rosterIn') : t('rosterOut'));
  b.append(dl);

  const note = form.n || (form.k === 'base' ? sp.n : '');
  if (note){ const w = el('div','warn'); w.textContent = t('notePrefix') + note; b.append(w); }
  if (!cur){
    const w = el('div','warn');
    w.textContent = t('warnRoster');
    b.append(w);
  }
  if (form.a){
    const w = el('div','warn');
    w.textContent = t('warnApprox');
    b.append(w);
  }

  b.append(statsSection(form), abilitiesSection(form), movesSection(sp, form));

  p.append(head, b);
  p.classList.add('on'); $('#veil').classList.add('on');
  p.scrollTop = y;
  if (!keepScroll) x.focus();
  // warm the other forms so switching is instant
  if (REMOTE !== false) sp.f.forEach(f=>{ const i=new Image(); i.src = SPRITES + f.s; });
  $('#live').textContent = sp.m + ' ' + formLabel(form);
  render();
}
function closeDetail(){
  state.sel = null; state.form = 0;
  $('#panel').classList.remove('on'); $('#veil').classList.remove('on');
  render();
}
function stepForm(d){
  if (!state.sel) return;
  const n = state.sel.f.length;
  if (n < 2) return;
  openDetail(state.sel, (state.form + d + n) % n, true);
}

/* ---- controls ---- */
function paintTypeChips(){
  const typeChipBg = mode().typeColor;   // in MODERN the chip itself is the type colour
  document.querySelectorAll('#types .chip').forEach(b=>{
    const ty = b.dataset.type;
    b.style.setProperty('--tc', TYPE_COLORS[ty]);
    b.style.setProperty('--tcInk', inkOn(TYPE_COLORS[ty]));
    b.querySelector('img').src = glyph(ty, typeChipBg ? 'typechip'
      : (b.getAttribute('aria-pressed') === 'true' ? 'accent' : 'surface'));
  });
}
/* One place that repaints every string, so a toggle can never leave the page half
   translated. Chip labels are re-read from the table rather than stored in the DOM. */
const ROSTER = 'Regular Roster M-B (current until 2026-09-02)';
function applyLang(){
  document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant' : 'en';
  // drives which name slots get pixel-crisp rendering (Latin) vs smoothing (CJK)
  document.body.classList.toggle('lang-en', state.lang === 'en');
  $('#lblSearch').textContent = t('search');
  $('#q').placeholder          = t('ph');
  $('#lblMode').textContent    = t('mode');
  $('#lblGen').textContent     = t('gen');
  $('#lblType').textContent    = t('type');
  $('#lblSort').textContent    = t('sort');
  $('#megaonly').textContent   = t('megaOnly');
  $('#multionly').textContent  = t('multiOnly');
  $('#reset').textContent      = t('reset');
  $('#sub').textContent = 'POKÉMON CHAMPIONS ・ ' + ROSTER;

  const tally = $('#tally'); tally.textContent = '';
  [[t('tSpecies'),DEX.meta.species],[t('tForms'),DEX.meta.formEntries],
   [t('tMega'),DEX.meta.megas],[t('tMoves'),DEX.meta.moves]].forEach(([k,v])=>{
    const d = el('div'); const b = el('b'); b.textContent = v;
    d.append(b, document.createTextNode(k)); tally.append(d);
  });

  document.querySelectorAll('#sorts .chip').forEach(b=>{
    const e = SORTS.find(([k])=>k === b.dataset.sort); if (e) b.textContent = t(e[1]);
  });
  document.querySelectorAll('#langs .chip').forEach(b=>{
    b.textContent = I18N[b.dataset.lang].lang;
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
  });
  document.querySelectorAll('#types .chip').forEach(b=>{
    b.querySelector('span').textContent = typeName(b.dataset.type);
  });

  const foot = $('#foot'); foot.textContent = '';
  t('footer').forEach(([label, body])=>{
    const line = el('div');
    const b = el('b'); b.textContent = label;
    line.append(b, document.createTextNode('　' + body.replace('Regular Roster M-B (current until 2026-09-02)', ROSTER)));
    foot.append(line);
  });

  render();
  if (state.sel) openDetail(state.sel, state.form, true);
}

function buildControls(){
  const lg = $('#langs');
  Object.keys(I18N).forEach(code=>{
    const b = el('button','chip'); b.type='button'; b.dataset.lang = code;
    b.addEventListener('click', ()=>{ if (state.lang === code) return;
      state.lang = code; applyLang(); paintTypeChips(); });
    lg.append(b);
  });
  const so = $('#sorts');
  SORTS.forEach(([k,lab])=>{
    const b = el('button','chip'); b.type='button'; b.textContent = lab;
    b.dataset.sort = k; b.setAttribute('aria-pressed', String(state.sort === k));
    b.addEventListener('click', ()=>{
      state.sort = k;
      document.querySelectorAll('#sorts .chip').forEach(x=>
        x.setAttribute('aria-pressed', String(x.dataset.sort === k)));
      render();
    });
    so.append(b);
  });
  const md = $('#modes');
  MODES.forEach((m,i)=>{
    const b = el('button','chip wide'); b.type='button'; b.textContent = m.id;
    b.dataset.mode = m.id; b.setAttribute('aria-pressed', String(i === state.mode));
    b.addEventListener('click', ()=>{ state.mode = i; applyMode(); });
    md.append(b);
  });
  const g = $('#gens');
  for (let i=1;i<=9;i++){
    const b = el('button','chip'); b.type='button'; b.textContent = GEN_ROMAN[i];
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click', ()=>{
      state.gens.has(i) ? state.gens.delete(i) : state.gens.add(i);
      b.setAttribute('aria-pressed', String(state.gens.has(i)));
      render();
    });
    g.append(b);
  }
  const t = $('#types');
  TYPE_ORDER.forEach(ty=>{
    const b = el('button','chip tc'); b.type='button'; b.dataset.type = ty;
    b.setAttribute('aria-pressed','false');
    const im = el('img'); im.alt=''; im.src = glyph(ty);
    const sp = el('span'); sp.textContent = typeName(ty); sp.dataset.i18n = 'type';
    b.append(im, sp);
    b.addEventListener('click', ()=>{
      state.types.has(ty) ? state.types.delete(ty) : state.types.add(ty);
      b.setAttribute('aria-pressed', String(state.types.has(ty)));
      paintTypeChips(); render();
    });
    t.append(b);
  });
}

$('#q').addEventListener('input', ev=>{ state.q = ev.target.value; render(); });
$('#reset').addEventListener('click', ()=>{
  state.q=''; state.gens.clear(); state.types.clear(); state.mega=false; state.multi=false;
  $('#q').value='';
  document.querySelectorAll('#gens .chip,#types .chip').forEach(b=>b.setAttribute('aria-pressed','false'));
  $('#megaonly').setAttribute('aria-pressed','false');
  $('#multionly').setAttribute('aria-pressed','false');
  paintTypeChips(); render();
});
$('#megaonly').addEventListener('click', ev=>{
  state.mega = !state.mega;
  ev.currentTarget.setAttribute('aria-pressed', String(state.mega)); render();
});
$('#multionly').addEventListener('click', ev=>{
  state.multi = !state.multi;
  ev.currentTarget.setAttribute('aria-pressed', String(state.multi)); render();
});
$('#veil').addEventListener('click', closeDetail);
addEventListener('keydown', ev=>{
  if (!state.sel) return;
  if (ev.key === 'Escape') closeDetail();
  else if (ev.key === 'ArrowRight'){ ev.preventDefault(); stepForm(1); }
  else if (ev.key === 'ArrowLeft'){  ev.preventDefault(); stepForm(-1); }
});

/* ---- boot ---- */
buildControls();
applyMode();      // tokens + glyph cache first, so applyLang's render has colours
applyLang();

/* One orchestrated reveal on load. The class is dropped once the last card has landed so
   later renders (filtering, mode/language switches) repaint instantly. */
document.body.classList.add('booting');
setTimeout(()=>document.body.classList.remove('booting'), 26 * 14 + 260);

/* Probe once: if remote art is blocked (offline, CSP, cold DNS) fall back wholesale
   rather than letting hundreds of broken images flash through. */
(function probe(){
  const t = setTimeout(()=>settle(false), 6000);
  const im = new Image();
  im.onload  = ()=>{ clearTimeout(t); settle(true);  };
  im.onerror = ()=>{ clearTimeout(t); settle(false); };
  im.src = SPRITES + '25.png';
  function settle(ok){
    if (REMOTE !== null) return;
    REMOTE = ok;
    if (!ok) render();
  }
})();
</script>
</body>
</html>
